---
- name: Verzeichnisse
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/tk, /usr/local/lib/tk, /var/lib/tk]

- name: Steckbrief aus NetBox
  ansible.builtin.template:
    src: host.json.j2
    dest: /etc/tk/host.json
    owner: root
    group: root
    mode: "0644"

- name: Statischer MOTD-Kopf (Banner und Steckbrief)
  ansible.builtin.template:
    src: motd-head.j2
    dest: /etc/tk/motd-head
    owner: root
    group: root
    mode: "0644"

- name: Platten laut NetBox
  ansible.builtin.template:
    src: disks.tsv.j2
    dest: /etc/tk/disks
    owner: root
    group: root
    mode: "0644"

# tk ist ein Rust-Binary (tk/). Der Steuerrechner baut es aus dem committeten Stand im festen
# Image baseline_tk_builder_image, Version = letzter Commit, der tk/ geaendert hat.
- name: tk-Version (letzter Commit an tk/)
  ansible.builtin.command: git -C "{{ playbook_dir }}/.." log -1 --format=%h -- tk
  register: baseline_tk_commit
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: tk bauen (nur wenn diese Version noch nicht im Cache liegt)
  ansible.builtin.shell: |
    set -eu
    out="{{ baseline_cache_dir }}/tk-{{ baseline_tk_commit.stdout }}"
    work=$(mktemp -d)
    git -C "{{ playbook_dir }}/.." archive "{{ baseline_tk_commit.stdout }}" tk | tar -x -C "$work"
    mkdir -p "{{ baseline_cache_dir }}/cargo"
    docker run --rm --user "$(id -u):$(id -g)" -e CARGO_HOME=/cargo -e TK_COMMIT="{{ baseline_tk_commit.stdout }}" \
      -v "{{ baseline_cache_dir }}/cargo:/cargo" -v "$work/tk:/src" -w /src \
      "{{ baseline_tk_builder_image }}" cargo build --release --locked
    install -m 0755 "$work/tk/target/release/tk" "$out.tmp"
    mv "$out.tmp" "$out"
    rm -rf "$work"
  args:
    creates: "{{ baseline_cache_dir }}/tk-{{ baseline_tk_commit.stdout }}"
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: tk installieren
  ansible.builtin.copy:
    src: "{{ baseline_cache_dir }}/tk-{{ baseline_tk_commit.stdout }}"
    dest: /usr/local/bin/tk
    owner: root
    group: root
    mode: "0755"

- name: Zaehler fuer offene Updates (apt-Hook)
  ansible.builtin.copy:
    src: apt-check-cache.sh
    dest: /usr/local/lib/tk/apt-check-cache
    owner: root
    group: root
    mode: "0755"

- name: Login-Hook
  ansible.builtin.copy:
    dest: /etc/profile.d/90-tk-thran-motd.sh
    content: |
      # managed by proxmox-linux-baseline (Ansible): MOTD einmal je interaktiver Sitzung
      case $- in *i*) ;; *) return ;; esac
      [ -n "${TK_MOTD_RENDERED:-}" ] && return
      export TK_MOTD_RENDERED=1
      [ -x /usr/local/bin/tk ] && /usr/local/bin/tk motd
    owner: root
    group: root
    mode: "0644"

- name: Bash-Renderer der Python-Fassung entfernen (tk motd ersetzt ihn)
  ansible.builtin.file:
    path: /usr/local/lib/tk/motd-render
    state: absent

- name: Alten MOTD-Renderer der Skript-Baseline entfernen
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/lib/tk-motd
    - /etc/update-motd.d/99-tk-thran-status
    - /etc/default/tk-motd

- name: Ubuntu-MOTD-Skripte stumm (das tk-MOTD ersetzt sie)
  ansible.builtin.shell: |
    changed=0
    for f in /etc/update-motd.d/*; do
      [ -f "$f" ] || continue
      if [ -x "$f" ]; then chmod 0644 "$f"; changed=1; fi
    done
    echo "$changed"
  register: baseline_motd_scripts
  changed_when: baseline_motd_scripts.stdout == "1"

- name: Ubuntu-News fuer das alte MOTD abschalten
  ansible.builtin.systemd_service:
    name: motd-news.timer
    enabled: false
    state: stopped
    masked: true
  failed_when: false

- name: Fehlgeschlagenen motd-news-Lauf vergessen
  ansible.builtin.shell: |
    for u in motd-news.service motd-news.timer; do
      if systemctl is-failed --quiet "$u"; then systemctl reset-failed "$u"; echo reset; fi
    done
  register: baseline_motd_news
  changed_when: "'reset' in baseline_motd_news.stdout"

- name: Update-Stand erstmals festhalten
  ansible.builtin.command: /usr/local/lib/tk/apt-check-cache
  changed_when: false
  when: not ansible_check_mode
