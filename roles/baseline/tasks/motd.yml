---
- name: Verzeichnisse
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/tk, /usr/local/lib/tk, /var/lib/tk]

- name: Steckbrief aus NetBox
  ansible.builtin.template:
    src: host.json.j2
    dest: /etc/tk/host.json
    owner: root
    group: root
    mode: "0644"

- name: Statischer MOTD-Kopf (Banner und Steckbrief)
  ansible.builtin.template:
    src: motd-head.j2
    dest: /etc/tk/motd-head
    owner: root
    group: root
    mode: "0644"

- name: Platten laut NetBox
  ansible.builtin.template:
    src: disks.tsv.j2
    dest: /etc/tk/disks
    owner: root
    group: root
    mode: "0644"

- name: Skripte
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: motd-render.sh, dest: /usr/local/lib/tk/motd-render }
    - { src: apt-check-cache.sh, dest: /usr/local/lib/tk/apt-check-cache }
    - { src: tk.py, dest: /usr/local/bin/tk }

- name: Login-Hook
  ansible.builtin.copy:
    dest: /etc/profile.d/90-tk-thran-motd.sh
    content: |
      # managed by proxmox-linux-baseline (Ansible): MOTD einmal je interaktiver Sitzung
      case $- in *i*) ;; *) return ;; esac
      [ -n "${TK_MOTD_RENDERED:-}" ] && return
      export TK_MOTD_RENDERED=1
      [ -x /usr/local/lib/tk/motd-render ] && /usr/local/lib/tk/motd-render
    owner: root
    group: root
    mode: "0644"

- name: Alten MOTD-Renderer der Skript-Baseline entfernen
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/lib/tk-motd
    - /etc/update-motd.d/99-tk-thran-status
    - /etc/default/tk-motd

- name: Ubuntu-MOTD-Skripte stumm (das tk-MOTD ersetzt sie)
  ansible.builtin.shell: |
    changed=0
    for f in /etc/update-motd.d/*; do
      [ -f "$f" ] || continue
      if [ -x "$f" ]; then chmod 0644 "$f"; changed=1; fi
    done
    echo "$changed"
  register: baseline_motd_scripts
  changed_when: baseline_motd_scripts.stdout == "1"

- name: Ubuntu-News fuer das alte MOTD abschalten
  ansible.builtin.systemd_service:
    name: motd-news.timer
    enabled: false
    state: stopped
    masked: true
  failed_when: false

- name: Fehlgeschlagenen motd-news-Lauf vergessen
  ansible.builtin.shell: |
    for u in motd-news.service motd-news.timer; do
      if systemctl is-failed --quiet "$u"; then systemctl reset-failed "$u"; echo reset; fi
    done
  register: baseline_motd_news
  changed_when: "'reset' in baseline_motd_news.stdout"

- name: Update-Stand erstmals festhalten
  ansible.builtin.command: /usr/local/lib/tk/apt-check-cache
  changed_when: false
  when: not ansible_check_mode
