[package]
name = "tk"
version = "0.1.0"
edition = "2021"
description = "Werkzeugkasten und MOTD der tk-thran-Gaeste (proxmox-linux-baseline)"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
