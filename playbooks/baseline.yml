---
# Linux-Baseline auf die Gaeste bringen.
#
#   ansible-playbook playbooks/baseline.yml --limit app-web --check --diff
#   ansible-playbook playbooks/baseline.yml --limit app-web
#
# Gruppe baseline = alle aktiven Linux-Gaeste aus NetBox ohne die Saltbox.
- name: Linux-Baseline
  # -e target=<gast> fuer Gaeste im Status planned (Aufbau), sonst die Gruppe baseline
  hosts: "{{ target | default('baseline') }}"
  become: true
  serial: 1
  roles:
    - baseline
